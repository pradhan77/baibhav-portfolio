<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="circleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b33" />
      <stop offset="50%" stop-color="#040b14" />
      <stop offset="100%" stop-color="#0a1526" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="accentRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#149ddd" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Deep Background Circle -->
  <circle cx="100" cy="100" r="100" fill="url(#circleBg)" />

  <!-- Outer Tech Accents -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#accentRing)" stroke-width="2" stroke-dasharray="6 4" opacity="0.75" />
  <circle cx="100" cy="100" r="84" fill="#040b14" stroke="#1e293b" stroke-width="1.5" />

  <!-- Inner Soft Radial Glow -->
  <circle cx="100" cy="100" r="70" fill="#149ddd" opacity="0.08" />

  <!-- Initials "BP" -->
  <text 
    x="100" 
    y="124" 
    font-family="'Raleway', 'Segoe UI', system-ui, sans-serif" 
    font-size="64" 
    font-weight="800" 
    letter-spacing="2"
    fill="url(#textGrad)" 
    text-anchor="middle"
  >
    BP
  </text>

  <!-- Bottom Cyber Accent Line -->
  <rect x="74" y="142" width="52" height="3" rx="1.5" fill="#149ddd" />
</svg>
